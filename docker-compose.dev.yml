services:
  web:
    image: oven/bun:1.2.14
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./:/app
      - bun_cache:/root/.bun/install/cache
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -lc "bun install && bun run dev --hostname 0.0.0.0 --port 3000"

volumes:
  bun_cache:
  node_modules:
  next_cache:
